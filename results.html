<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexTrip - Search Results</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-image: url("blur.png");
        min-height: 100vh;
        color: #333;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 1rem 5%;
        position: fixed;
        width: 100%;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.1);
      }

      .logo {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        animation: fadeInDown 1s ease;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 2rem;
        animation: fadeInDown 1s ease;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 25px;
        transition: background 0.3s;
      }

      .nav-links a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .search-summary {
        padding-top: 80px;
        padding-bottom: 20px;
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        margin-bottom: 2rem;
        animation: fadeIn 1s ease;
      }

      .summary-text {
        font-size: 1.2rem;
        color: white;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      }

      .results-container {
        padding: 0 5% 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        animation: fadeInUp 1s ease;
      }

      .section {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease;
      }

      .section:hover {
        transform: translateY(-5px);
      }

      .section-title {
        color: #3cc4a0;
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
        text-align: center;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }

      .place-card {
        background: white;
        border-radius: 15px;
        padding: 1.2rem;
        margin-bottom: 1rem;
        transition: all 0.3s ease;
        border: 1px solid rgba(60, 196, 160, 0.2);
      }

      .place-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(60, 196, 160, 0.15);
      }

      .place-name {
        font-weight: bold;
        margin-bottom: 0.8rem;
        color: #2a2a2a;
        font-size: 1.1rem;
      }

      .place-rating {
        color: #ffa41b;
        margin-bottom: 0.8rem;
        font-size: 0.9rem;
      }

      .place-address {
        color: #666;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .price-level {
        color: #3cc4a0;
        margin-bottom: 0.8rem;
        font-size: 1rem;
      }

      .loading {
        text-align: center;
        padding: 2rem;
        font-size: 1.2rem;
        color: #3cc4a0;
        animation: pulse 1.5s infinite;
      }

      .error {
        color: #ff4444;
        text-align: center;
        padding: 1rem;
        background: rgba(255, 68, 68, 0.1);
        border-radius: 10px;
        margin-top: 1rem;
      }

      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .results-container {
          grid-template-columns: 1fr;
        }

        .section {
          margin: 0 1rem;
        }
      }
      /* Previous styles remain the same */

      /* Add new styles for photos */
      .place-photo {
        width: 100%;
        height: 200px;
        border-radius: 12px;
        margin-bottom: 1rem;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .place-photo:hover {
        transform: scale(1.02);
      }

      .place-card {
        background: white;
        border-radius: 15px;
        padding: 1.2rem;
        margin-bottom: 1.5rem;
        transition: all 0.3s ease;
        border: 1px solid rgba(60, 196, 160, 0.2);
      }

      .photo-placeholder {
        width: 100%;
        height: 200px;
        background: linear-gradient(45deg, #3cc4a0, #2a8c71);
        border-radius: 12px;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.9rem;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .additional-photo {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .additional-photo:hover {
        transform: scale(1.05);
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 1001;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        max-width: 90%;
        max-height: 90vh;
      }

      .modal-img {
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
      }

      .close-modal {
        position: absolute;
        top: 20px;
        right: 20px;
        color: white;
        font-size: 30px;
        cursor: pointer;
        z-index: 1002;
      }

      .photo-navigation {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }

      .photo-nav-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
      }

      .photo-nav-dot.active {
        background: white;
      }

      @media (max-width: 768px) {
        .photo-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="home.html" class="logo">nexTrip</a>
      <div class="nav-links">
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">TOUR</a>
        <a href="#">CONTACT</a>
      </div>
    </nav>

    <div class="search-summary">
      <p class="summary-text" id="summary"></p>
    </div>

    <div class="results-container">
      <div class="section" id="hotels">
        <h2 class="section-title">Hotels</h2>
        <div class="places-list"></div>
      </div>
      <div class="section" id="restaurants">
        <h2 class="section-title">Restaurants</h2>
        <div class="places-list"></div>
      </div>
      <div class="section" id="attractions">
        <h2 class="section-title">Tourist Attractions</h2>
        <div class="places-list"></div>
      </div>
      <div class="section" id="activities">
        <h2 class="section-title">Activities</h2>
        <div class="places-list"></div>
      </div>
    </div>
    <div class="modal" id="photoModal">
      <span class="close-modal">&times;</span>
      <img class="modal-img" id="modalImg" src="" alt="Place photo" />
      <div class="photo-navigation" id="photoNav"></div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCYfbALNCOqIObWX92SnbYhQOoKPp0x3tk&libraries=places"></script>
    <script src="results.js"></script>
  </body>
</html>
