<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexTrip - Split Bill</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(to bottom right, #1a2b3c, #0f2027);
        min-height: 100vh;
        color: white;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 15px 0;
        background-color: transparent;
      }

      .navbar a {
        color: white;
        text-decoration: none;
        margin-right: 15px;
        opacity: 0.7;
        transition: opacity 0.3s;
      }

      .navbar a:hover {
        opacity: 1;
      }

      .navbar .logout {
        color: #ff6b6b;
      }

      .trip-name {
        text-align: center;
        margin: 20px 0;
        font-size: 1.5rem;
        color: white;
      }

      .expense-categories {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .category-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.3s;
      }

      .category-item.active,
      .category-item:hover {
        opacity: 1;
      }

      .category-item img {
        width: 50px;
        height: 50px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        padding: 10px;
      }

      .category-item span {
        margin-top: 10px;
      }

      .split-bill-form {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 30px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .form-grid input,
      .form-grid select {
        width: 100%;
        padding: 10px;
        background-color: rgba(255, 255, 255, 0.1);
        border: none;
        border-radius: 5px;
        color: white;
      }

      .form-grid input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .split-persons {
        grid-column: 1 / -1;
      }

      .split-persons .person-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .person-item {
        display: flex;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.1);
        padding: 5px 10px;
        border-radius: 20px;
      }

      .person-item input {
        margin-right: 5px;
      }

      .action-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .btn-split {
        background-color: #2ecc71;
        color: white;
      }

      .btn-view {
        background-color: #3498db;
        color: white;
      }

      .btn:hover {
        opacity: 0.9;
      }

      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="navbar">
        <div>
          <a href="#" class="active">HOME</a>
          <a href="#">ABOUT</a>
          <a href="#">PLAN</a>
          <a href="#">BUDGET TRACKER</a>
          <a href="#">CONTACT</a>
        </div>
        <a href="#" class="logout">LOGOUT</a>
      </nav>

      <h2 class="trip-name">Trip Name</h2>

      <div class="expense-categories">
        <div class="category-item active">
          <img src="https://via.placeholder.com/50?text=🍽️" alt="Food" />
          <span>Food</span>
        </div>
        <div class="category-item">
          <img src="https://via.placeholder.com/50?text=🚌" alt="Travel" />
          <span>Travel</span>
        </div>
        <div class="category-item">
          <img src="https://via.placeholder.com/50?text=..." />
          <span>Others</span>
        </div>
      </div>

      <div class="split-bill-form">
        <form>
          <div class="form-grid">
            <input type="number" placeholder="Total amount" required />
            <input type="text" placeholder="Description" required />
            <input type="date" required />

            <div class="split-persons">
              <h3>Split with:</h3>
              <div class="person-list">
                <div class="person-item">
                  <input type="checkbox" id="person1" checked />
                  <label for="person1">John</label>
                </div>
                <div class="person-item">
                  <input type="checkbox" id="person2" />
                  <label for="person2">Emma</label>
                </div>
                <div class="person-item">
                  <input type="checkbox" id="person3" />
                  <label for="person3">Mike</label>
                </div>
              </div>
            </div>
          </div>

          <div class="action-buttons">
            <button type="button" class="btn btn-split">Split</button>
            <button type="button" class="btn btn-view">View Expense</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
