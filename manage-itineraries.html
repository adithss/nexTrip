<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexTrip - Manage Itineraries</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <style>
      /* Reuse existing styles from view-itinerary.html */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }
      body {
        background-image: url("blur.png");
        min-height: 100vh;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 1rem 5%;
        position: fixed;
        width: 100%;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.1);
      }
      .logo {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        gap: 2rem;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 25px;
        transition: background 0.3s;
      }
      .nav-links a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      /* New styles for manage itineraries */
      .itinerary-list {
        padding: 100px 5% 2rem;
      }

      .itinerary-preview {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 1.5rem;
        margin: 1rem 0;
        cursor: pointer;
        transition: transform 0.3s;
      }

      .itinerary-preview:hover {
        transform: translateX(10px);
      }

      h1 {
        color: white;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="home.html" class="logo">nexTrip</a>
      <div class="nav-links">
        <a href="home.html">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">Budget tracking</a>
        <a href="#">My Docs</a>
        <a href="#" class="active">MY ITINERARIES</a>
      </div>
    </nav>

    <div class="itinerary-list">
      <h1>My Saved Itineraries</h1>
      <div id="itinerariesList"></div>
    </div>

    <script src="manage-itineraries.js"></script>
  </body>
</html>
