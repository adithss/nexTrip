    <p>To make a cell span more than one row, use the rowspan attribute.</p>

      <tr>
      <th rowspan="2"></th>
        <th colspan="2">Name</th>
        <th rowspan="2">Red eyes</th>
      </tr>
      <tr>
        
        <th >height</th>
        <th >weight</th>
       
      </tr>
