<!-- home.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexTrip - Dream, Plan, Go</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-image: url("blur.png");
        min-height: 100vh;
        overflow-x: hidden;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 1rem 5%;
        position: fixed;
        width: 100%;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.1);
      }

      .logo {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        animation: fadeInDown 1s ease;
      }

      .nav-links {
        display: flex;
        gap: 2rem;
        animation: fadeInDown 1s ease;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 25px;
        transition: background 0.3s;
      }

      .nav-links a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .logout-btn {
        background: #3cc4a0;
        color: white;
        border: none;
        padding: 0.5rem 1.5rem;
        border-radius: 25px;
        cursor: pointer;
        animation: fadeInDown 1s ease;
      }

      .main-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

      .content-card {
        width: 90%;
        max-width: 1200px;
        height: 80vh;
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        animation: fadeIn 1.5s ease;
      }

      .image-container {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
      }

      .hero-content {
        position: absolute;
        top: 20%;
        left: 5%;
        color: white;
        z-index: 2;
        animation: fadeInLeft 1.5s ease;
      }

      .hero-content h1 {
        font-size: 4rem;
        line-height: 1.2;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .hero-content p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      }

      .search-bar {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(60, 196, 160, 0.9);
        padding: 1rem;
        border-radius: 50px;
        display: flex;
        gap: 1rem;
        width: 90%;
        max-width: 1000px;
        animation: fadeInUp 1.5s ease;
      }

      .search-group {
        flex: 1;
        position: relative;
      }

      .search-group input,
      .search-group .date-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: none;
        border-radius: 25px;
        background: white;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .search-group input.error {
        border: 2px solid #ff4444;
        background-color: #fff8f8;
      }

      .search-group input:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(60, 196, 160, 0.3);
      }

      .error-message {
        position: absolute;
        bottom: -20px;
        left: 10px;
        color: #ff4444;
        font-size: 0.8rem;
        display: none;
      }

      .search-btn {
        background: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
      }

      .search-btn:hover {
        transform: scale(1.05);
      }

      .search-btn svg {
        width: 24px;
        height: 24px;
        fill: #3cc4a0;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(0, 0, 0, 0.1) 50%,
          rgba(0, 0, 0, 0.3) 100%
        );
        border-radius: 20px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeInLeft {
        from {
          opacity: 0;
          transform: translateX(-50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translate(-50%, 50px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">nexTrip</div>
      <div class="nav-links">
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">TOUR</a>
        <a href="#">CONTACT</a>
      </div>
      <button class="logout-btn">LOGOUT</button>
    </nav>

    <div class="main-container">
      <div class="content-card">
        <div class="image-container">
          <img src="homebg.png" alt="Canyon with turquoise water" />
          <div class="overlay"></div>
        </div>
        <div class="hero-content">
          <h1>Dream,<br />Plan,<br />Go.</h1>
          <p>Pack your bags, we got the rest!</p>
        </div>

        <div class="search-bar">
          <div class="search-group">
            <input
              type="text"
              placeholder="Enter your destination (e.g., London)"
              id="location"
              required
            />
            <div class="error-message"></div>
          </div>
          <div class="search-group">
            <input type="date" class="date-input" id="travel-date" required />
            <div class="error-message"></div>
          </div>
          <div class="search-group">
            <input
              type="number"
              placeholder="Max price (e.g., 1000)"
              id="max-price"
              min="1"
              step="1"
              required
            />
            <div class="error-message"></div>
          </div>
          <button class="search-btn">
            <svg viewBox="0 0 24 24">
              <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Set up date input constraints
        const dateInput = document.getElementById("travel-date");
        const today = new Date().toISOString().split("T")[0];
        dateInput.min = today;

        function showError(inputElement, message) {
          inputElement.classList.add("error");
          const errorDiv =
            inputElement.parentElement.querySelector(".error-message");
          errorDiv.textContent = message;
          errorDiv.style.display = "block";
        }

        function clearError(inputElement) {
          inputElement.classList.remove("error");
          const errorDiv =
            inputElement.parentElement.querySelector(".error-message");
          errorDiv.style.display = "none";
        }

        function validateLocation(location) {
          if (!location || location.trim().length === 0) {
            throw new Error("Please enter a destination");
          }
          // Remove invalid characters
          return location.trim().replace(/[^\w\s,-]/g, "");
        }

        function validatePrice(price) {
          const numPrice = parseFloat(price);
          if (isNaN(numPrice) || numPrice <= 0) {
            throw new Error("Please enter a valid price");
          }
          return numPrice;
        }

        function validateDate(date) {
          if (!date) {
            throw new Error("Please select a travel date");
          }
          const selectedDate = new Date(date);
          const currentDate = new Date();

          if (selectedDate < currentDate) {
            throw new Error("Please select a future date");
          }
          return date;
        }

        // Add input validation events
        const locationInput = document.getElementById("location");
        const maxPriceInput = document.getElementById("max-price");

        locationInput.addEventListener("input", function () {
          clearError(this);
        });

        maxPriceInput.addEventListener("input", function () {
          clearError(this);
        });

        dateInput.addEventListener("input", function () {
          clearError(this);
        });

        // Add search button handler
        const searchBtn = document.querySelector(".search-btn");
        searchBtn.addEventListener("click", () => {
          try {
            const location = validateLocation(locationInput.value);
            const date = validateDate(dateInput.value);
            const maxPrice = validatePrice(maxPriceInput.value);

            const searchParams = {
              location: location,
              date: date,
              maxPrice: maxPrice,
            };

            console.log("Storing search parameters:", searchParams);
            localStorage.setItem("searchParams", JSON.stringify(searchParams));

            window.location.href = "results.html";
          } catch (error) {
            if (error.message.includes("destination")) {
              showError(locationInput, error.message);
            } else if (error.message.includes("price")) {
              showError(maxPriceInput, error.message);
            } else if (error.message.includes("date")) {
              showError(dateInput, error.message);
            } else {
              alert(error.message);
            }
          }
        });
      });
    </script>
  </body>
</html>
