<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexTrip - My Itineraries</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-image: url("blur.png");
        min-height: 100vh;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        padding: 1rem 5%;
        position: fixed;
        width: 100%;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.1);
      }

      .logo {
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 2rem;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 25px;
        transition: background 0.3s;
      }

      .nav-links a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .itinerary-container {
        padding: 100px 5% 2rem;
      }

      .itinerary-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        animation: fadeIn 0.5s ease;
      }

      .itinerary-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(60, 196, 160, 0.2);
      }

      .day-card {
        background: white;
        border-radius: 15px;
        padding: 1.5rem;
        margin: 1rem 0;
        border: 1px solid rgba(60, 196, 160, 0.2);
        transition: transform 0.3s ease;
      }

      .day-card:hover {
        transform: translateY(-2px);
      }

      .activity-item {
        margin: 1rem 0;
        display: flex;
        gap: 1rem;
        align-items: center;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 10px;
      }

      .activity-photo {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 10px;
      }

      .no-itineraries {
        text-align: center;
        padding: 2rem;
        color: #666;
        background: white;
        border-radius: 20px;
        margin-top: 2rem;
      }

      .btn {
        display: inline-block;
        padding: 0.8rem 1.5rem;
        background: #3cc4a0;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        margin-top: 1rem;
        transition: background 0.3s;
      }

      .btn:hover {
        background: #2da885;
      }

      h1 {
        color: white;
        margin-bottom: 2rem;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="home.html" class="logo">nexTrip</a>
      <div class="nav-links">
        <a href="home.html">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">TOUR</a>
        <a href="manage-itineraries.html" class="active">MY ITINERARIES</a>
      </div>
    </nav>

    <div class="itinerary-container">
      <h1>My Travel Itineraries</h1>
      <div id="itinerariesList"></div>
    </div>

    <script src="view-itinerary.js"></script>
  </body>
</html>
